services:
  woqu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: woqu
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - WOQU_PORT=8080
      - WOQU_DATA_DIR=/app/data
      - TZ=Asia/Shanghai
      # 可选：首次自动设置登录密码
      # - WOQU_INITIAL_PASSWORD=your-password
      # 可选：自定义 AES-256 加密主密钥（32位字符或64位hex），不填将自动生成并持久化到 data/.secrets.json
      # - WOQU_MASTER_KEY=
      # 可选：自定义 JWT 签名密钥
      # - WOQU_JWT_SECRET=
