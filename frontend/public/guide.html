<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我趣文档 Woqu — 官方使用文档与功能参考</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>" />
  <style>
    :root {
      --bg: #ffffff;
      --sidebar: #f7f7f5;
      --panel: #fbfbfa;
      --hover: #efefec;
      --active: #e6e6e1;
      --border: #e9e9e7;
      --text: #1f2329;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.08);
      --purple: #7c3aed;
      --purple-soft: rgba(124, 58, 237, 0.08);
      --green-soft: rgba(16, 185, 129, 0.1);
      --amber-soft: rgba(245, 158, 11, 0.12);
      --code-bg: #1e2430;
      --code-text: #e2e8f0;
      --inline-code-bg: rgba(135, 131, 120, 0.15);
      --inline-code-text: #eb5757;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    html.dark {
      --bg: #191919;
      --sidebar: #202020;
      --panel: #252525;
      --hover: #2c2c2b;
      --active: #343432;
      --border: #333332;
      --text: #e6e6e4;
      --muted: #9b9a97;
      --accent: #60a5fa;
      --accent-soft: rgba(96, 165, 250, 0.14);
      --purple: #a78bfa;
      --purple-soft: rgba(167, 139, 250, 0.14);
      --green-soft: rgba(16, 185, 129, 0.16);
      --amber-soft: rgba(245, 158, 11, 0.16);
      --code-bg: #14171f;
      --code-text: #e2e8f0;
      --inline-code-bg: rgba(255, 255, 255, 0.1);
      --inline-code-text: #f87171;
      --shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.35); border-radius: 9999px; }

    .layout {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 264px;
      flex-shrink: 0;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      user-select: none;
      z-index: 40;
      transition: transform 0.2s ease;
    }
    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
    }
    .brand-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .icon-btn {
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 12px;
      transition: background 0.15s, color 0.15s;
    }
    .icon-btn:hover { background: var(--hover); color: var(--text); }

    .search-trigger {
      margin: 10px 10px 6px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .search-trigger:hover { border-color: var(--accent); }
    .kbd {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 5px;
      background: var(--hover);
      color: var(--muted);
      font-family: ui-monospace, monospace;
    }

    .nav-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px 16px;
    }
    .nav-group-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      padding: 10px 10px 4px;
    }
    .nav-item {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text);
      opacity: 0.84;
      text-align: left;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      margin-bottom: 2px;
      transition: background 0.12s;
    }
    .nav-item:hover { background: var(--hover); opacity: 1; }
    .nav-item.active {
      background: var(--active);
      font-weight: 600;
      opacity: 1;
    }
    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .footer-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 8px;
      text-decoration: none;
      color: var(--muted);
      font-size: 12px;
    }
    .footer-link:hover { background: var(--hover); color: var(--text); }

    /* Main Workspace */
    .main-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .topbar {
      height: 48px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-size: 13px;
      font-weight: 500;
    }
    .mobile-menu-btn { display: none; }

    .content-row {
      flex: 1;
      min-height: 0;
      display: flex;
    }
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 36px 28px 80px;
    }
    .doc-container {
      margin: 0 auto;
      max-width: 820px;
      transition: max-width 0.2s ease;
      line-height: 1.75;
      font-size: 15.5px;
    }
    .doc-container.wide { max-width: 1120px; }

    /* Right TOC */
    .toc-panel {
      width: 232px;
      flex-shrink: 0;
      border-left: 1px solid var(--border);
      background: var(--panel);
      padding: 18px 14px;
      overflow-y: auto;
    }
    .toc-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 10px;
      letter-spacing: 0.03em;
    }
    .toc-link {
      display: block;
      text-decoration: none;
      color: var(--muted);
      font-size: 12px;
      padding: 5px 8px;
      border-radius: 6px;
      line-height: 1.45;
      margin-bottom: 2px;
      border-left: 2px solid transparent;
    }
    .toc-link:hover { background: var(--hover); color: var(--text); }
    .toc-link.active {
      color: var(--accent);
      border-left-color: var(--accent);
      background: var(--accent-soft);
      font-weight: 600;
    }
    .toc-link.level-3 { padding-left: 18px; font-size: 11.5px; }

    /* Typography & Blocks (Wolai/Notion Style) */
    .page-hero { margin-bottom: 26px; }
    .page-icon { font-size: 42px; line-height: 1.1; margin-bottom: 8px; }
    .page-title { font-size: 32px; font-weight: 800; margin: 0 0 10px; line-height: 1.25; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag-pill {
      font-size: 11.5px;
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--hover);
      color: var(--muted);
    }

    h2 {
      font-size: 22px;
      font-weight: 700;
      margin: 34px 0 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    h3 {
      font-size: 17px;
      font-weight: 650;
      margin: 22px 0 8px;
    }
    p { margin: 10px 0; }
    ul, ol { padding-left: 22px; margin: 8px 0 14px; }
    li { margin: 5px 0; }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.87em;
      background: var(--inline-code-bg);
      color: var(--inline-code-text);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Callout */
    .callout {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 12px;
      margin: 16px 0;
      font-size: 14px;
      line-height: 1.65;
      border: 1px solid;
    }
    .callout-blue { background: rgba(59, 130, 246, 0.08); border-color: rgba(59, 130, 246, 0.25); }
    .callout-purple { background: rgba(139, 92, 246, 0.08); border-color: rgba(139, 92, 246, 0.25); }
    .callout-green { background: rgba(16, 185, 129, 0.08); border-color: rgba(16, 185, 129, 0.25); }
    .callout-amber { background: rgba(245, 158, 11, 0.09); border-color: rgba(245, 158, 11, 0.28); }
    .callout-icon { font-size: 19px; line-height: 1.3; flex-shrink: 0; }

    /* Code block */
    .code-wrap {
      margin: 14px 0;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--code-bg);
      color: var(--code-text);
    }
    .code-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 12px;
      background: rgba(0, 0, 0, 0.22);
      font-size: 11.5px;
      color: #94a3b8;
    }
    .copy-btn {
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    .copy-btn:hover { background: rgba(255, 255, 255, 0.14); }
    pre {
      margin: 0;
      padding: 14px 16px;
      overflow-x: auto;
      font-size: 13px;
      line-height: 1.6;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    pre code { background: none; color: inherit; padding: 0; font-size: inherit; }

    /* Tables */
    .table-wrap { overflow-x: auto; margin: 14px 0; border-radius: 10px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; text-align: left; }
    th, td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { background: var(--sidebar); font-weight: 600; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--panel); }

    /* Cards Grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin: 16px 0;
    }
    .info-card {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .info-card h4 { margin: 0 0 6px; font-size: 14px; display: flex; align-items: center; gap: 6px; }
    .info-card p { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.55; }

    /* Toggle Block */
    .toggle-block {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 10px;
      padding: 10px 14px;
      margin: 10px 0;
    }
    .toggle-block summary {
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      outline: none;
    }
    .toggle-block[open] summary { margin-bottom: 8px; }

    /* Filter Chips & Interactive Controls */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 12px 0;
    }
    .chip {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--muted);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    .chip.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
    }
    .mini-input {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12.5px;
      outline: none;
      min-width: 190px;
    }
    .mini-input:focus { border-color: var(--accent); }

    /* Pager */
    .pager {
      margin-top: 44px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .pager-btn {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 12px;
      padding: 12px 16px;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .pager-btn:hover { border-color: var(--accent); }
    .pager-btn.next { text-align: right; }
    .pager-label { font-size: 11px; color: var(--muted); }
    .pager-title { font-size: 13.5px; font-weight: 600; margin-top: 3px; }

    /* Search Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(2px);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding-top: 12vh;
      z-index: 60;
    }
    .modal-backdrop.open { display: flex; }
    .search-modal {
      width: 92%;
      max-width: 580px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .search-modal-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .search-modal-input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .search-results { max-height: 380px; overflow-y: auto; padding: 8px; }
    .search-hit {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text);
      text-align: left;
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
      display: block;
    }
    .search-hit:hover { background: var(--hover); }
    .search-hit-title { font-size: 13px; font-weight: 600; }
    .search-hit-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

    /* Flow Diagram */
    .flow-box {
      margin: 16px 0;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 12.5px;
    }
    .flow-node {
      padding: 8px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-weight: 600;
      text-align: center;
    }
    .flow-arrow { color: var(--muted); font-weight: bold; }

    .mobile-backdrop { display: none; }

    @media (max-width: 1024px) {
      .toc-panel { display: none; }
    }
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .mobile-backdrop.open {
        display: block;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        z-index: 35;
      }
      .mobile-menu-btn { display: inline-flex; }
      .scroll-area { padding: 24px 16px 60px; }
      .pager { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="mobile-backdrop" id="mobileBackdrop"></div>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span>✨ 我趣文档 Woqu</span>
          <span class="brand-badge">使用手册</span>
        </div>
        <button class="icon-btn" id="themeBtn" title="切换浅/深主题">🌙</button>
      </div>

      <button class="search-trigger" id="openSearchBtn">
        <span>🔍 搜索文档 / 命令 / 公式...</span>
        <span class="kbd">⌘K</span>
      </button>

      <nav class="nav-list" id="navList"></nav>

      <div class="sidebar-footer">
        <a class="footer-link" href="/" target="_self">🏠 返回 Woqu 工作区</a>
        <a class="footer-link" href="https://github.com/backbay2/woqu" target="_blank" rel="noopener noreferrer">📦 GitHub 开源仓库</a>
      </div>
    </aside>

    <!-- Main Column -->
    <div class="main-col">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn mobile-menu-btn" id="mobileMenuBtn">☰ 目录</button>
          <span id="breadcrumb">🚀 产品概览与快速上手</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px;">
          <button class="icon-btn" id="widthToggleBtn" title="切换标准/宽屏阅读宽度">↔️ 宽屏</button>
        </div>
      </header>

      <div class="content-row">
        <main class="scroll-area" id="scrollArea">
          <article class="doc-container" id="docContainer"></article>
        </main>
        <aside class="toc-panel">
          <div class="toc-title">本页大纲 (TOC)</div>
          <div id="tocList"></div>
        </aside>
      </div>
    </div>
  </div>

  <!-- Global Search Modal -->
  <div class="modal-backdrop" id="searchBackdrop">
    <div class="search-modal" id="searchModal">
      <div class="search-modal-head">
        <span>🔍</span>
        <input class="search-modal-input" id="searchInput" placeholder="搜索使用章节、/斜杠命令、公式函数或常见问题..." />
        <button class="icon-btn" id="closeSearchBtn">✕</button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <script>
    const SLASH_COMMANDS = [
      { group: 'AI 写作助手', name: 'AI 智能续写', keys: 'ai, continue, xuxie, 续写', desc: '读取前 1500 字上下文流式续写下一段' },
      { group: 'AI 写作助手', name: 'AI 生成大纲 / 草稿', keys: 'ai, outline, draft, 大纲', desc: '输入主题生成结构化文章大纲与正文' },
      { group: 'AI 写作助手', name: 'AI 生成全文摘要与待办', keys: 'ai, summary, 摘要, 总结', desc: '提炼文档核心摘要、要点与行动项' },
      { group: '基础块', name: '正文段落', keys: 'text, paragraph, p, 正文', desc: '切换为普通文字段落' },
      { group: '基础块', name: '一级标题 H1', keys: 'h1, heading1, 一级标题', desc: '大号章节标题（自动同步右侧大纲）' },
      { group: '基础块', name: '二级标题 H2', keys: 'h2, heading2, 二级标题', desc: '中号小节标题（自动同步右侧大纲）' },
      { group: '基础块', name: '三级标题 H3', keys: 'h3, heading3, 三级标题', desc: '小号子标题（自动同步右侧大纲）' },
      { group: '基础块', name: '无序列表', keys: 'ul, bullet, list, 无序列表', desc: '项目符号清单，支持 Tab 嵌套缩进' },
      { group: '基础块', name: '有序列表', keys: 'ol, ordered, number, 有序列表', desc: '自动递增编号列表' },
      { group: '基础块', name: '待办清单 (To-do)', keys: 'todo, task, check, 待办', desc: '可点击勾选的任务清单' },
      { group: '基础块', name: '引用块', keys: 'quote, blockquote, 引用', desc: '左侧蓝色竖线高亮引用段落' },
      { group: '基础块', name: '分割线', keys: 'hr, divider, line, 分割线', desc: '插入水平视觉分隔线' },
      { group: '高级排版', name: '柔色提示块 (Callout)', keys: 'callout, tip, note, 提示块', desc: 'Wolai 风格 8 色圆角背景框 + 8 种图标' },
      { group: '高级排版', name: '折叠块 (Toggle)', keys: 'toggle, collapse, 折叠', desc: '可展开/收起的嵌套详情块' },

    let activeChapterId = location.hash.replace('#', '') || CHAPTERS[0].id;
    let slashGroupFilter = '全部';
    let slashTextFilter = '';
    let formulaCatFilter = '全部';
    let formulaTextFilter = '';
    let activePresetKey = 'deepseek';

    function initTheme() {
      const saved = localStorage.getItem('woqu-theme');
      const isDark = saved ? saved === 'dark' : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', isDark);
      document.getElementById('themeBtn').textContent = isDark ? '☀️' : '🌙';
    }

    document.getElementById('themeBtn').addEventListener('click', () => {
      const nextDark = !document.documentElement.classList.contains('dark');
      document.documentElement.classList.toggle('dark', nextDark);
      localStorage.setItem('woqu-theme', nextDark ? 'dark' : 'light');
      document.getElementById('themeBtn').textContent = nextDark ? '☀️' : '🌙';
    });

    document.getElementById('widthToggleBtn').addEventListener('click', () => {
      const el = document.getElementById('docContainer');
      const isWide = el.classList.toggle('wide');
      document.getElementById('widthToggleBtn').textContent = isWide ? '↔️ 窄屏' : '↔️ 宽屏';
    });

    const sidebar = document.getElementById('sidebar');
    const mobileBackdrop = document.getElementById('mobileBackdrop');
    document.getElementById('mobileMenuBtn').addEventListener('click', () => {
      sidebar.classList.add('open');
      mobileBackdrop.classList.add('open');
    });
    mobileBackdrop.addEventListener('click', () => {
      sidebar.classList.remove('open');
      mobileBackdrop.classList.remove('open');
    });

    function renderSidebar() {
      const nav = document.getElementById('navList');
      const groups = {};
      CHAPTERS.forEach((c) => { (groups[c.group] ||= []).push(c); });
      nav.innerHTML = Object.entries(groups)
        .map(([g, items]) => `
          <div class="nav-group-title">${g}</div>
          ${items.map((c) => `
            <button class="nav-item ${c.id === activeChapterId ? 'active' : ''}" data-id="${c.id}">
              <span>${c.icon}</span><span>${c.title}</span>
            </button>
          `).join('')}
        `).join('');
      nav.querySelectorAll('.nav-item').forEach((btn) => {
        btn.addEventListener('click', () => selectChapter(btn.dataset.id));
      });
    }

    function selectChapter(id) {
      if (!CHAPTERS.some((c) => c.id === id)) id = CHAPTERS[0].id;
      activeChapterId = id;
      history.replaceState(null, '', '#' + id);
      sidebar.classList.remove('open');
      mobileBackdrop.classList.remove('open');
      renderSidebar();
      renderContent();
      document.getElementById('scrollArea').scrollTop = 0;
    }

    function renderContent() {
      const idx = CHAPTERS.findIndex((c) => c.id === activeChapterId);
      const ch = CHAPTERS[idx] || CHAPTERS[0];
      document.getElementById('breadcrumb').textContent = `${ch.icon} ${ch.title}`;

      const prev = idx > 0 ? CHAPTERS[idx - 1] : null;
      const next = idx < CHAPTERS.length - 1 ? CHAPTERS[idx + 1] : null;

      const container = document.getElementById('docContainer');
      container.innerHTML = `
        <div class="page-hero">
          <div class="page-icon">${ch.icon}</div>
          <h1 class="page-title">${ch.title}</h1>
          <div class="tag-row">${ch.tags.map((t) => `<span class="tag-pill">#${t}</span>`).join('')}</div>
        </div>
        ${ch.html}
        <div class="pager">
          ${prev ? `<button class="pager-btn" data-go="${prev.id}"><div class="pager-label">← 上一章</div><div class="pager-title">${prev.icon} ${prev.title}</div></button>` : '<div></div>'}
          ${next ? `<button class="pager-btn next" data-go="${next.id}"><div class="pager-label">下一章 →</div><div class="pager-title">${next.icon} ${next.title}</div></button>` : '<div></div>'}
        </div>
      `;

      container.querySelectorAll('[data-go]').forEach((b) => {
        b.addEventListener('click', () => selectChapter(b.dataset.go));
      });

      container.querySelectorAll('.copy-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          navigator.clipboard?.writeText(btn.dataset.copy || '');
          const old = btn.textContent;
          btn.textContent = '已复制 ✓';
          setTimeout(() => { btn.textContent = old; }, 1400);
        });
      });

      if (ch.id === 'editor') bindSlashInteractive();
      if (ch.id === 'formula') bindFormulaInteractive();
      if (ch.id === 'ai') bindAIPresetInteractive();
      buildTOC();
    }

    function bindSlashInteractive() {
      const groups = ['全部', ...new Set(SLASH_COMMANDS.map((s) => s.group))];
      const chipsEl = document.getElementById('slashGroupChips');
      const inputEl = document.getElementById('slashFilterInput');
      const bodyEl = document.getElementById('slashTableBody');

      const paint = () => {
        chipsEl.innerHTML = groups.map((g) => `<button class="chip ${g === slashGroupFilter ? 'active' : ''}" data-g="${g}">${g}</button>`).join('');
        chipsEl.querySelectorAll('.chip').forEach((c) => c.addEventListener('click', () => { slashGroupFilter = c.dataset.g; paint(); }));

        const q = slashTextFilter.trim().toLowerCase();
        const rows = SLASH_COMMANDS.filter((s) =>
          (slashGroupFilter === '全部' || s.group === slashGroupFilter) &&
          (!q || s.name.toLowerCase().includes(q) || s.keys.toLowerCase().includes(q) || s.desc.toLowerCase().includes(q))
        );
        bodyEl.innerHTML = rows.map((s) => `
          <tr>
            <td><span class="tag-pill">${s.group}</span></td>
            <td><b>${s.name}</b></td>
            <td><code>${s.keys}</code></td>
            <td>${s.desc}</td>
          </tr>
        `).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--muted)">无匹配命令</td></tr>';
      };

      inputEl.value = slashTextFilter;
      inputEl.addEventListener('input', (e) => { slashTextFilter = e.target.value; paint(); });
      paint();
    }

    function bindFormulaInteractive() {
      const cats = ['全部', ...new Set(FORMULA_DOCS.map((f) => f.cat))];
      const chipsEl = document.getElementById('formulaCatChips');
      const inputEl = document.getElementById('formulaSearchInput');
      const bodyEl = document.getElementById('formulaTableBody');

      const paint = () => {
        chipsEl.innerHTML = cats.map((c) => `<button class="chip ${c === formulaCatFilter ? 'active' : ''}" data-c="${c}">${c}</button>`).join('');
        chipsEl.querySelectorAll('.chip').forEach((c) => c.addEventListener('click', () => { formulaCatFilter = c.dataset.c; paint(); }));

        const q = formulaTextFilter.trim().toLowerCase();
        const rows = FORMULA_DOCS.filter((f) =>
          (formulaCatFilter === '全部' || f.cat === formulaCatFilter) &&
          (!q || f.fn.toLowerCase().includes(q) || f.desc.toLowerCase().includes(q))
        );
        bodyEl.innerHTML = rows.map((f) => `
          <tr>
            <td><span class="tag-pill">${f.cat}</span></td>
            <td><code>${f.fn}</code></td>
            <td>${f.desc}</td>
          </tr>
        `).join('') || '<tr><td colspan="3" style="text-align:center;color:var(--muted)">无匹配公式</td></tr>';
      };

      inputEl.value = formulaTextFilter;
      inputEl.addEventListener('input', (e) => { formulaTextFilter = e.target.value; paint(); });
      paint();
    }

    function bindAIPresetInteractive() {
      const tabsEl = document.getElementById('aiPresetTabs');
      const detailEl = document.getElementById('aiPresetDetail');

      const paint = () => {
        tabsEl.innerHTML = Object.entries(AI_PRESETS).map(([k, v]) => `
          <button class="chip ${k === activePresetKey ? 'active' : ''}" data-k="${k}">${v.title}</button>
        `).join('');
        tabsEl.querySelectorAll('.chip').forEach((b) => b.addEventListener('click', () => { activePresetKey = b.dataset.k; paint(); }));

        const p = AI_PRESETS[activePresetKey];
        detailEl.innerHTML = `
          <div><b>${p.title}</b> · 协议：<code>${p.proto}</code></div>
          <div>Base URL：<code>${p.url}</code></div>
          <div>推荐模型：<code>${p.models}</code></div>
          <div style="color:var(--muted);font-size:13px">${p.tip}</div>
        `;
      };
      paint();
    }

    function buildTOC() {
      const container = document.getElementById('docContainer');
      const tocEl = document.getElementById('tocList');
      const headings = Array.from(container.querySelectorAll('h2, h3'));
      headings.forEach((h, i) => { h.id = 'sec-' + i; });
      tocEl.innerHTML = headings.map((h, i) => `
        <a href="#sec-${i}" class="toc-link ${h.tagName === 'H3' ? 'level-3' : ''}" data-target="sec-${i}">${h.textContent}</a>
      `).join('');

      tocEl.querySelectorAll('.toc-link').forEach((a) => {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          const target = document.getElementById(a.dataset.target);
          target?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });

      const scrollArea = document.getElementById('scrollArea');
      scrollArea.onscroll = () => {
        let activeIdx = 0;
        const topOffset = scrollArea.getBoundingClientRect().top + 80;
        headings.forEach((h, i) => {
          if (h.getBoundingClientRect().top <= topOffset) activeIdx = i;
        });
        tocEl.querySelectorAll('.toc-link').forEach((a, i) => {
          a.classList.toggle('active', i === activeIdx);
        });
      };
    }

    // Global Cmd/Ctrl + K Search
    const searchBackdrop = document.getElementById('searchBackdrop');
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');

    function openSearch() {
      searchBackdrop.classList.add('open');
      searchInput.value = '';
      renderSearch('');
      setTimeout(() => searchInput.focus(), 40);
    }
    function closeSearch() { searchBackdrop.classList.remove('open'); }

    function renderSearch(q) {
      const kw = q.trim().toLowerCase();
      const hits = [];
      CHAPTERS.forEach((c) => {
        const text = c.html.replace(/<[^>]+>/g, ' ');
        if (!kw || c.title.toLowerCase().includes(kw) || text.toLowerCase().includes(kw)) {
          hits.push({ chId: c.id, title: `${c.icon} ${c.title}`, sub: `章节 · ${c.group}` });
        }
      });
      if (kw) {
        SLASH_COMMANDS.forEach((s) => {
          if (s.name.toLowerCase().includes(kw) || s.keys.toLowerCase().includes(kw) || s.desc.toLowerCase().includes(kw)) {
            hits.push({ chId: 'editor', title: `/ ${s.name}`, sub: `斜杠命令 · ${s.desc}` });
          }
        });
        FORMULA_DOCS.forEach((f) => {
          if (f.fn.toLowerCase().includes(kw) || f.desc.toLowerCase().includes(kw)) {
            hits.push({ chId: 'formula', title: f.fn, sub: `公式函数 (${f.cat}) · ${f.desc}` });
          }
        });
      }
      searchResults.innerHTML = hits.slice(0, 14).map((h) => `
        <button class="search-hit" data-ch="${h.chId}">
          <div class="search-hit-title">${h.title}</div>
          <div class="search-hit-sub">${h.sub}</div>
        </button>
      `).join('') || '<div style="padding:20px;text-align:center;font-size:12px;color:var(--muted)">未找到匹配结果</div>';

      searchResults.querySelectorAll('.search-hit').forEach((b) => {
        b.addEventListener('click', () => {
          closeSearch();
          selectChapter(b.dataset.ch);
        });
      });
    }

    document.getElementById('openSearchBtn').addEventListener('click', openSearch);
    document.getElementById('closeSearchBtn').addEventListener('click', closeSearch);
    searchBackdrop.addEventListener('click', (e) => { if (e.target === searchBackdrop) closeSearch(); });
    searchInput.addEventListener('input', (e) => renderSearch(e.target.value));
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        searchBackdrop.classList.contains('open') ? closeSearch() : openSearch();
      } else if (e.key === 'Escape') {
        closeSearch();
      }
    });

    initTheme();
    renderSidebar();
    renderContent();
  </script>
</body>
